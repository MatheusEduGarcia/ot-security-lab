name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get update && sudo apt-get install -y mosquitto graphviz iptables
      - run: sudo systemctl stop mosquitto || true
      # Ubuntu's AppArmor profile only lets mosquitto read /etc/mosquitto; the lab writes its configs elsewhere
      - run: sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.mosquitto 2>/dev/null || true
      - run: pip install -r requirements.txt
      - name: debug mosquitto
        run: |
          sudo aa-status 2>/dev/null | grep -i -A2 mosq || true
          ls /etc/apparmor.d | grep -i mosq || true
          sudo mkdir -p /etc/mosquitto/dbg && printf 'listener 18830 127.0.0.1\nallow_anonymous true\n' | sudo tee /etc/mosquitto/dbg/m.conf
          sudo timeout 2 mosquitto -c /etc/mosquitto/dbg/m.conf -v || true
          sudo dmesg | grep -i -E "apparmor|denied" | tail -5 || true
      # root is needed for the live firewall (iptables) and loopback capture tests
      - run: sudo -E env "PATH=$PATH" python -m pytest -q -rs
